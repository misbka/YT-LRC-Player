<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YT Player — Músicas + Letras Sincronizadas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo">▶ <span>YT Player</span></div>
    <form id="search-form" autocomplete="off">
      <input id="search-input" type="text" placeholder="Buscar música... ex: Coldplay Yellow" />
      <button type="submit">Buscar</button>
    </form>
  </header>

  <main>
    <section id="sidebar" class="results">
      <div class="tabs">
        <button id="tab-search" class="tab active">🔍 Busca</button>
        <button id="tab-playlists" class="tab">🎵 Playlists</button>
      </div>

      <div id="results" class="pane">
        <p class="hint">Busque uma música para começar.</p>
      </div>

      <div id="playlists-panel" class="pane hidden">
        <div class="pane-header">
          <span>Suas playlists</span>
          <button id="btn-new-playlist" class="btn-small">＋ Nova</button>
        </div>
        <div id="playlist-list"></div>
      </div>

      <div id="playlist-view" class="pane hidden">
        <div class="pane-header">
          <button id="btn-back-playlists" class="btn-small ghost">← Voltar</button>
          <span id="playlist-view-title" class="pane-title"></span>
          <span class="pane-actions">
            <button id="btn-play-playlist" class="btn-small" title="Tocar playlist">▶ Tocar</button>
            <button id="btn-shuffle-playlist" class="btn-small" title="Embaralhar e tocar">🔀</button>
            <button id="btn-rename-playlist" class="btn-small ghost" title="Renomear">✎</button>
            <button id="btn-delete-playlist" class="btn-small ghost danger" title="Excluir playlist">🗑</button>
          </span>
        </div>
        <div id="playlist-songs"></div>
      </div>
    </section>

    <section id="stage" class="stage hidden">
      <div class="player-box">
        <div id="yt-player"></div>
        <div class="video-meta">
          <h2 id="video-title"></h2>
          <p id="video-channel"></p>
        </div>
        <div class="transport">
          <button id="btn-prev" title="Música anterior">⏮</button>
          <button id="btn-play" title="Tocar/Pausar">▶</button>
          <button id="btn-next" title="Próxima música">⏭</button>
          <button id="btn-add-current" title="Adicionar esta música a uma playlist">➕</button>
          <span id="time">0:00 / 0:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0" />
          <span id="vol-icon">🔊</span>
          <input id="volume" type="range" min="0" max="100" value="80" />
        </div>
      </div>

      <div class="lyrics-box">
        <div class="lyrics-header">
          <strong id="lyrics-title">Letra</strong>
          <span id="lyrics-badge" class="badge">buscando…</span>
        </div>
        <div id="lyrics" class="lyrics"><p class="hint">Procurando letra no LRCLIB…</p></div>
      </div>
    </section>
  </main>

  <!-- Modal para criar/renomear playlist -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="modal-title">Nova playlist</h3>
      <p id="modal-msg" class="modal-msg"></p>
      <input id="modal-input" type="text" maxlength="50" placeholder="Nome da playlist" />
      <div class="modal-actions">
        <button id="modal-cancel" class="ghost">Cancelar</button>
        <button id="modal-ok">OK</button>
      </div>
    </div>
  </div>

  <!-- Modal para escolher a playlist de destino -->
  <div id="picker" class="modal hidden">
    <div class="modal-box">
      <h3 id="picker-title">Adicionar à playlist</h3>
      <div id="picker-list" class="picker-list"></div>
      <div class="picker-new">
        <input id="picker-input" type="text" maxlength="50" placeholder="Ou crie uma nova playlist…" />
        <button id="picker-create">Criar</button>
      </div>
      <div class="modal-actions">
        <button id="picker-cancel" class="ghost">Fechar</button>
      </div>
    </div>
  </div>

  <!-- Toast de confirmação -->
  <div id="toast" class="toast hidden"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
</html>
